<!DOCTYPE html>
<html>
<head>
    <title>Muro Verde - Acceso</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { background: #e8f5e9; font-family: sans-serif; text-align: center; padding-top: 50px; }
        .card { background: white; padding: 20px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input { display: block; margin: 10px auto; padding: 10px; width: 200px; border: 1px solid #ccc; border-radius: 5px; }
        button { background: #2e7d32; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <img src="/logo.png" width="80" alt="IPN">
        <h2>Muro Verde Setup</h2>
        <form method="POST">
            <input type="text" name="usuario" placeholder="Usuario" required>
            <input type="password" name="password" placeholder="Contraseña" required>
            <button type="submit">Entrar al Sistema</button>
        </form>
    </div>
</body>
</html>
